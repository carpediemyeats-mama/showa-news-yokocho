abled{opacity:1}.feedback{border:1px solid #5a654f;background:#262d2b;border-radius:13px;padding:17px;margin:17px 0;line-height:1.85}.feedback strong{color:var(--gold)}.btn{width:100%;border:0;border-radius:12px;padding:15px;background:var(--red);color:#fff;font-weight:900;margin-top:12px;min-height:48px}.btn.secondary{background:#303a4e}.btn:disabled{opacity:.6}.small{font-size:12px;color:var(--muted);line-height:1.8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat{background:#1b2534;border:1px solid #374055;border-radius:12px;padding:15px 6px;text-align:center}.stat strong{display:block;font-size:24px;color:var(--gold)}.stat span{font-size:10px;color:var(--muted)}.award{padding:18px;background:linear-gradient(120deg,#342a28,#1d2636);border:1px solid #756042;border-radius:14px;margin:13px 0}.award h3{margin:0 0 8px}.award p{margin:0;color:#cdd3dd;font-size:12px;line-height:1.8}.locked{opacity:.52}.notice{border-left:3px solid var(--gold);background:#202838;padding:12px;font-size:12px;line-height:1.8;color:#d2d8e3;margin:18px 0}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:850px;background:#111723;border-top:1px solid #343c4e;display:flex;z-index:5}.nav button{flex:1;background:none;border:0;color:#b5bfce;padding:11px 4px 13px;font-size:11px}.nav b{display:block;font-size:21px;margin-bottom:4px}.nav button.on{color:#fff}.empty{padding:26px;border:1px dashed #536079;border-radius:13px;color:var(--muted);line-height:1.8;text-align:center}.sources{overflow-wrap:anywhere}.divider{border:0;border-top:1px solid #343c4e;margin:24px 0}

</style></head><body><div class="shell"><header class="top"><div class="logo"><b>▶</b> NEWS BREAK</div><div id="rank" class="rank">見習い論客</div></header><main id="app" class="content">読み込み中…</main><nav class="nav"><button id="home"><b>▶</b>対戦</button><button id="awards"><b>♛</b>称号</button><button id="archive"><b>▤</b>新聞クイズ</button><button id="help"><b>ⓘ</b>案内</button></nav></div><script>
(()=>{'use strict';if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
const app=document.getElementById('app'),RKEY='news-break-v1',OLD='showa-quest-v1';let data=[],news=[],current=null,turn=0,results=[],mode='debate',filter='all',state={completed:{},attempts:{},mastery:{}};try{state=Object.assign(state,JSON.parse(localStorage.getItem(RKEY)||'{}'))}catch(e){}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]))}function persist(){try{localStorage.setItem(RKEY,JSON.stringify(state))}catch(e){}}
function totals(){let a=Object.values(state.mastery||{});return {win:a.filter(x=>x==='challenge').length,accept:a.filter(x=>x==='accept').length,judge:a.filter(x=>x==='judge').length,games:Object.keys(state.completed).length}}
function rank(){let t=totals();return t.win>=6&&t.accept>=6&&t.judge>=3?'賢者の論客':t.win>=6?'論破王':t.accept>=3?'公正な論客':t.win>=3?'反論の達人':t.games>=1?'見習い論客':'挑戦者'}
function updateRank(){document.getElementById('rank').textContent='♛ '+rank()}
function nav(id){document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.id===id))}
function home(){nav('home');updateRank();app.className='content';let t=totals();app.innerHTML='<section class="hero"><div class="eyebrow">NEWS × LOGIC × DEBATE</div><h1>その主張、<br>根拠はある？</h1><p>鋭い反論で論破を決めろ。でも、正しい主張には潔くうなずけ。それが最強の論客だ。</p><span class="badge">3ターンで決着</span> <span class="badge">広告なし・無料</span></section><div class="stats"><div class="stat"><strong>'+t.win+'</strong><span>反論成功</span></div><div class="stat"><strong>'+t.accept+'</strong><span>正しく認めた</span></div><div class="stat"><strong>'+t.games+'</strong><span>攻略済み</span></div></div><div class="eyebrow">DEBATE EPISODES</div><h2>今週の対戦</h2><p class="small">架空の論客との対話。反論すべきか、相手を認めるべきかを見極めよう。</p><div class="tabs"><button class="tab '+(filter==='all'?'on':'')+'" data-filter="all">すべて</button><button class="tab '+(filter==='new'?'on':'')+'" data-filter="new">未攻略</button><button class="tab '+(filter==='done'?'on':'')+'" data-filter="done">攻略済み</button></div>'+data.filter(d=>filter==='all'||(filter==='new'?!state.completed[d.id]:!!state.completed[d.id])).map((d,i)=>'<button class="card" data-id="'+esc(d.id)+'"><div class="thumb"><span class="live">● DEBATE</span><span class="face">'+(['😏','🧐','🤨'][i%3])+'</span><span class="time">3 ROUNDS</span></div><div class="body"><span class="badge">'+esc(d.topic)+'</span> <span class="badge">'+esc(d.level)+'</span> <span class="badge">'+(state.completed[d.id]?'✓ 攻略済み':'NEW')+'</span><h3>'+esc(d.title)+'</h3><div class="meta">'+esc(d.summary)+'</div></div></button>').join('')+'<div class="notice">練習用3対戦と、出典を確認した2026年10月のニュース対戦3本を収録しています。実際の動画・AI自由会話ではありません。</div>';app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;home()});app.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>start(b.dataset.id,'debate'))}
function start(id,m){mode=m;current=(m==='debate'?data:news).find(x=>x.id===id);if(!current)return;turn=0;results=[];draw()}
function getTurns(){return mode==='debate'?current.turns:current.questions.map(q=>({kind:'quiz',claim:q.prompt,prompt:'正しい答えを選べ',choices:q.choices,answerIndex:q.answerIndex,explanation:q.explanation}))}
function draw(){nav(mode==='debate'?'home':'archive');let turns=getTurns(),q=turns[turn];app.className='';app.innerHTML='<div class="video" id="battleScreen"><span class="live">● ON AIR</span><span class="screen-label">架空の論客 ヒロ</span><div class="face" id="opponentFace">'+(q.kind==='accept'?'🤔':'😏')+'</div><div class="caption" id="opponentCaption">「'+esc(q.claim)+'」</div></div><div class="progress"><div style="width:'+((turn+1)/turns.length*100)+'%"></div></div><div class="content"><button class="back" id="back">← 対戦一覧へ</button><div class="eyebrow">ROUND '+(turn+1)+' / '+turns.length+' ・ '+(mode==='debate'?'NEWS DEBATE':'NEWS QUIZ')+'</div><h2>'+esc(current.title)+'</h2><div class="dialog"><strong>論客：</strong><br>「'+esc(q.claim)+'」</div><p class="question">'+esc(q.prompt)+'</p><div id="options">'+q.choices.map((x,i)=>'<button class="choice" data-answer="'+i+'"><b>'+String.fromCharCode(65+i)+'</b>'+esc(x)+'</button>').join('')+'</div><div id="response"></div></div>';document.getElementById('back').onclick=()=>mode==='debate'?home():archive();app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)))}
function answer(n){let q=getTurns()[turn];if(results.length>turn)return;let ok=n===q.answerIndex;results.push({kind:q.kind,correct:ok});app.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;let i=Number(b.dataset.answer);if(i===q.answerIndex)b.classList.add('correct');else if(i===n)b.classList.add('wrong')});let label=ok?(q.kind==='accept'?'見事な承認！':q.kind==='judge'?'冷静な見極め！':'反論成功！'):'相手の反撃！';let screen=document.getElementById('battleScreen'),face=document.getElementById('opponentFace'),caption=document.getElementById('opponentCaption');let comeback=ok?(q.kind==='challenge'?'……その指摘は正しい。今の主張は言い過ぎでした。':q.kind==='accept'?'そこを認められるのは強いですね。議論が前に進みます。':'……根拠を分けて考えるべきでしたね。'):'いや、そこでは僕の主張は崩せませんよ？';let effect=ok?(q.kind==='challenge'?'論破成功！':q.kind==='accept'?'見事な承認！':'見極め成功！'):'反撃を受けた！';screen.classList.add(ok?(q.kind==='accept'?'respect':'defeated'):'counter');if(ok&&q.kind==='challenge')screen.classList.add('shaken');face.textContent=ok?(q.kind==='challenge'?'😵':q.kind==='accept'?'🙂':'😮'):'😏';caption.textContent='「'+comeback+'」';let impact=document.createElement('div');impact.className='impact '+(ok?(q.kind==='accept'?'respect-text':''):'counter-text');impact.textContent=effect;screen.appendChild(impact);let response=document.getElementById('response');response.innerHTML='<div class="comment-feed"><span class="reaction">● 論客のリアクション</span><br><strong>'+esc(comeback)+'</strong><br>💬 視聴者コメント：'+esc(ok?(q.kind==='accept'?'相手の正しさを認めるのもかっこいい。':'そこを突くのか！ 筋が通ってる。'):'ここから立て直せる！ 解説を読もう。')+'</div><div class="feedback"><strong>'+label+'</strong><p>'+esc(q.explanation)+'</p></div><button class="btn" id="next">'+(turn===getTurns().length-1?'結果と称号を見る':'次の反論へ →')+'</button>';document.getElementById('next').onclick=()=>{if(++turn<getTurns().length)draw();else finish()}}
function finish(){let id=current.id,success=results.filter(x=>x.correct).length,first=false;if(mode==='debate'){if(!state.completed[id]){state.completed[id]={finishedAt:new Date().toISOString()};first=true}results.forEach((r,i)=>{if(r.correct&&!state.mastery[id+':'+i])state.mastery[id+':'+i]=r.kind});state.attempts[id]=(state.attempts[id]||0)+1;persist()}else{try{let old=JSON.parse(localStorage.getItem(OLD)||'{}');old[id]={score:success,finishedAt:new Date().toISOString()};localStorage.setItem(OLD,JSON.stringify(old))}catch(e){}}updateRank();app.className='content';app.innerHTML='<div class="eyebrow">DEBATE FINISHED</div><h1 class="headline">'+(success===getTurns().length?'完全勝利！':success>=2?'論戦終了！':'再挑戦しよう')+'</h1><div class="hero"><div class="eyebrow">RESULT</div><h1>'+success+' / '+getTurns().length+' TURN</h1><p>'+(mode==='debate'?'論破だけでなく、正しい主張を認める力も勝利の条件。':'ニュースの解説を読み、知識を確かめよう。')+'</p></div>'+(mode==='debate'?'<div class="award"><h3>♛ 現在の称号：'+rank()+'</h3><p>'+(first?'正しく判断できた問題を実績に反映しました。':'再挑戦で初めて正解した問題は実績に反映されます。同じ問題の重複加点はありません。')+'</p></div>':'<div class="award"><h3>'+esc(current.reward?.title||'今日の発見')+'</h3><p>'+esc(current.reward?.text||current.summary||'')+'</p></div><div class="small sources">'+(current.sources||[]).map(s=>s.url?'<a href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">'+esc(s.title||s.url)+'</a>':'').join('<br>')+'</div>')+'<button class="btn" id="again">もう一度挑戦</button><button class="btn secondary" id="exit">一覧に戻る</button>';document.getElementById('again').onclick=()=>start(id,mode);document.getElementById('exit').onclick=()=>mode==='debate'?home():archive()}
function awards(){nav('awards');updateRank();let t=totals(),list=[['見習い論客',t.games>=1,'最初の対戦を完了'],['反論の達人',t.win>=3,'異なる問題で反論成功3回'],['論破王',t.win>=6,'異なる問題で反論成功6回'],['公正な論客',t.accept>=3,'異なる問題で正しい主張を3回認める'],['賢者の論客',t.win>=6&&t.accept>=6&&t.judge>=3,'反論6回・承認6回・見極め3回']];app.className='content';app.innerHTML='<div class="eyebrow">YOUR ACHIEVEMENTS</div><h1 class="headline">論客の称号</h1><p class="lead">言い負かすだけが強さじゃない。根拠が正しいときに相手を認められる論客が、最後にたどり着く。</p><div class="stats"><div class="stat"><strong>'+t.win+'</strong><span>反論成功</span></div><div class="stat"><strong>'+t.accept+'</strong><span>承認成功</span></div><div class="stat"><strong>'+t.judge+'</strong><span>見極め成功</span></div></div>'+list.map((a,i)=>'<div class="award '+(a[1]?'':'locked')+'"><h3>'+(a[1]?'🏆':'🔒')+' '+a[0]+'</h3><p>'+a[2]+'　'+(a[1]?'／獲得済み':'／未獲得')+'</p></div>').join('')+'<div class="notice">一度正解した問題は重複加点しません。間違えた問題は再挑戦で初めて正解すると加点されます。</div>'}
function archive(){nav('archive');app.className='content';app.innerHTML='<div class="eyebrow">NEWS ARCHIVE</div><h1 class="headline">新聞クイズ</h1><p class="lead">従来のニュース4択はここに残しています。こちらの結果は論破称号の実績には含まれません。</p>'+news.map((a,i)=>'<button class="card" data-news="'+esc(a.id)+'"><div class="body"><span class="badge">'+esc(a.category||'ニュース')+'</span><h3>'+esc(a.title)+'</h3><p class="small">'+esc(a.summary||'')+'</p><span class="meta">'+esc(a.date||'')+'</span></div></button>').join('')+(news.length?'':'<div class="empty">news.json が見つからないため、新聞クイズはありません。</div>');app.querySelectorAll('[data-news]').forEach(b=>b.onclick=()=>start(b.dataset.news,'quiz'))}
function help(){nav('help');app.className='content';app.innerHTML='<div class="eyebrow">HOW TO PLAY</div><h1 class="headline">遊び方と更新</h1><div class="dialog"><strong>1. 論客の主張を聞く</strong><br>事実誤認や論理の飛躍がないか考える。<hr class="divider"><strong>2. 反論か承認かを選ぶ</strong><br>正しい意見を認めると「承認成功」。<hr class="divider"><strong>3. 称号を獲得</strong><br>問題ごとの初回正解を蓄積。周回では稼げない。</div><p class="small">この版は事前に作成した会話を選択肢で進めるゲームです。AIとの自由会話や動画再生はありません。架空の論客を使用しています。debates.json に新しい対戦を追加できます。旧ニュースの news.json と既存の記録は残します。進行状況はこの端末・ブラウザー内に保存されます。</p>'}
document.getElementById('home').onclick=home;document.getElementById('awards').onclick=awards;document.getElementById('archive').onclick=archive;document.getElementById('help').onclick=help;
function validate(d){if(!d||!Array.isArray(d.debates))throw Error('debates 配列がありません');let ids=new Set();d.debates.forEach(x=>{if(!x.id||ids.has(x.id)||!x.title||!Array.isArray(x.turns)||x.turns.length<2)throw Error('対戦データの形式が不正です');ids.add(x.id);x.turns.forEach(q=>{if(!['challenge','accept','judge'].includes(q.kind)||!q.claim||!q.prompt||!q.explanation||!Array.isArray(q.choices)||q.choices.length!==3||new Set(q.choices).size!==3||!Number.isInteger(q.answerIndex)||q.answerIndex<0||q.answerIndex>2)throw Error('選択肢・正答に不備があります')})});return d.debates}
Promise.all([fetch('./debates.json?rev=3',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('debates.json を配置してください');return r.json()}).then(validate),fetch('./news.json?rev=3',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>d&&Array.isArray(d.news)?d.news:[]).catch(()=>[])]).then(([a,b])=>{data=a;news=b;home()}).catch(e=>{app.innerHTML='<div class="notice">読み込みエラー：'+esc(e.message)+'<br>index.html と debates.json を同じフォルダにアップロードしてください。</div>'});
})();
