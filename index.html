<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>昭和ニュース横丁</title><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#a63d2d">
<style>
:root{--paper:#f5e5bf;--ink:#392c22;--red:#a63d2d;--blue:#284c59}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Yu Mincho","Hiragino Mincho ProN",serif}
.street{min-height:100vh;background:linear-gradient(#172d42 0%,#59636b 36%,#a87b54 36%,#a87b54 39%,#52473b 39%);padding:22px 12px 45px}
.shell{max-width:790px;margin:auto}.sky{text-align:center;color:#f7d9a0;text-shadow:2px 3px #1b1b1b}
.sky small{letter-spacing:.35em}.sky h1{font-size:clamp(32px,7vw,58px);margin:8px 0;letter-spacing:.12em}.sky p{margin:5px 0 22px}
.sign{background:#b34831;border:6px solid #e8c67f;box-shadow:0 7px #542e24;color:#fff2cc;text-align:center;padding:14px;letter-spacing:.12em;font-size:24px}
.shop{border:9px solid #5b3427;background:repeating-linear-gradient(90deg,#e7d3a6 0 60px,#ddc99d 60px 64px);padding:18px;box-shadow:8px 12px #1e2529}
.paper{background:var(--paper);border:2px solid #967c55;padding:18px;box-shadow:3px 5px #8e7356;min-height:330px}
.meta{font-size:12px;color:#705e49}.heading{border-bottom:3px double #594a39;padding-bottom:9px;font-size:25px}
.btn{background:var(--blue);color:#fff5d9;border:2px solid #182d34;padding:12px 15px;font:700 16px sans-serif;cursor:pointer;margin:4px}
.secondary{background:#a64a32}.choice{display:block;width:100%;text-align:left;margin:10px 0;background:#fff8e8;color:#34281d;border:2px solid #98815c;padding:13px;font:16px sans-serif;cursor:pointer}
.choice:disabled{opacity:1}.choice.good{background:#d8ebd6}.choice.bad{background:#f0d0c6}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tile{border:3px solid #80603f;background:#fff5dc;padding:14px;text-align:left;cursor:pointer;color:inherit}
.tile p,.reward{line-height:1.7}.reward{background:#f9f0d5;border:3px double #ad8648;padding:16px;margin:12px 0}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.stamp{color:var(--red);border:3px double var(--red);padding:5px;font-weight:bold}
.hint{font-size:13px;line-height:1.6;color:#68553c}.foot{margin-top:18px;color:#f3d6a3;font-size:12px;text-align:center}
input[type=file]{max-width:100%}@media(max-width:500px){.shop{padding:10px}.paper{padding:13px}}
</style></head><body>
<div class="street"><div class="shell"><header class="sky"><small>昭和レトロ学習探検</small><h1>昭和ニュース横丁</h1><p>新聞をめくれば、世界が広がる。</p></header>
<div class="sign">夕刊ニュース屋　◉　知識探偵団</div><main class="shop"><div class="paper" id="app"><h2>新聞を準備しています…</h2><p>少々お待ちください。</p></div></main>
<div class="foot">外部広告・音声なし／記録は端末ごとに保存／ニュースは管理者が更新</div></div></div>
<script>
(function(){
"use strict";
var app=document.getElementById("app");
var KEY="showa-quest-v1",packs=[],active=null,index=0,answers=[],saved={};
try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){saved={}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function top(){return '<div class="row"><span class="meta">昭和ニュース横丁 / 長男編</span><span class="stamp">知識探偵</span></div>'}
function store(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}
function validate(x){
 if(!x||x.schemaVersion!=="1.0"||!Array.isArray(x.news))throw Error("ニュース形式が正しくありません");
 var ids=new Set();
 x.news.forEach(function(p){
  if(!p||!p.id||!p.title||!p.summary||!p.reward||!p.reward.title||!p.reward.text||!Array.isArray(p.questions)||p.questions.length!==4||!Array.isArray(p.sources)||!p.sources.length)throw Error("ニュースの項目が不足しています");
  if(ids.has(p.id))throw Error("IDが重複しています: "+p.id);ids.add(p.id);
  var count={common:0,older:0};
  p.questions.forEach(function(q){
   if(!q||!q.id||ids.has(q.id)||!Object.prototype.hasOwnProperty.call(count,q.audience)||!q.prompt||!Array.isArray(q.choices)||q.choices.length!==4||new Set(q.choices).size!==4||!Number.isInteger(q.answerIndex)||q.answerIndex<0||q.answerIndex>3||!q.explanation)throw Error("問題の形式が正しくありません");
   ids.add(q.id);count[q.audience]++;
  });
  if(count.common!==2||count.older!==2)throw Error("共通2問・長男2問が必要です");
 });
 return x.news;
}
function home(){
 active=null;
 var tiles=packs.map(function(p,i){return '<button class="tile" data-pack="'+i+'"><span class="meta">'+esc(p.category)+(p.isDemo?" / 体験版":"")+'</span><h3>'+esc(p.title)+'</h3><p>'+esc(p.summary)+'</p><span class="stamp">'+(saved[p.id]?"読了":"未読")+'</span></button>'}).join("");
 var lib=packs.filter(function(p){return saved[p.id]}).map(function(p){return '<details class="reward"><summary>'+esc(p.reward.title)+' 📖</summary><p>'+esc(p.reward.text)+'</p></details>'}).join("");
 app.innerHTML=top()+'<h2 class="heading">本日の新聞棚</h2><p>新聞記事を選んで、4つの謎を解こう。読了すると「ひみつの豆知識」が開くぞ。</p><div class="tiles">'+tiles+'</div><hr><h3>古本屋・発見図鑑</h3>'+(lib||'<p class="hint">新聞を読み終えると、ここに歴史や漫画の考察が並ぶよ。</p>')+'<hr><h3>今週の新聞を更新するには</h3><p class="hint">公開サイトの news.json を差し替えると、新しい新聞が届きます。ここから一時的にJSONを追加することもできます（再起動後は残りません）。</p><input type="file" id="file" accept=".json,application/json"><p class="hint" id="notice"></p>';
 app.querySelectorAll("[data-pack]").forEach(function(b){b.onclick=function(){start(packs[Number(b.getAttribute("data-pack"))])}});
 document.getElementById("file").onchange=loadFile;
}
function start(p){active=p;index=0;answers=[];question()}
function qs(){return active.questions.filter(function(q){return q.audience==="common"||q.audience==="older"})}
function question(){
 var list=qs(),q=list[index],ans=answers[index];
 var choices=q.choices.map(function(c,i){var cls=ans===undefined?"":i===q.answerIndex?" good":i===ans?" bad":"";return '<button class="choice'+cls+'" data-answer="'+i+'" '+(ans!==undefined?"disabled":"")+'>'+"アイウエ"[i]+'　'+esc(c)+'</button>'}).join("");
 var feedback=ans===undefined?'<p class="hint">選択肢を押すと、正解と解説が出るよ。</p>':'<div class="reward"><strong>'+(ans===q.answerIndex?"正解！":"惜しい！ 正解は「"+esc(q.choices[q.answerIndex])+"」")+'</strong><p>'+esc(q.explanation)+'</p></div><button class="btn" id="next">'+(index===list.length-1?"新聞を読み終える":"次の問題へ")+'</button>';
 app.innerHTML=top()+'<p class="meta">'+esc(active.title)+' / 第'+(index+1)+'問・全'+list.length+'問</p><h2 class="heading">'+esc(q.prompt)+'</h2>'+choices+feedback+'<p><button class="btn secondary" id="back">新聞棚へ戻る</button></p>';
 app.querySelectorAll("[data-answer]").forEach(function(b){b.onclick=function(){answers[index]=Number(b.getAttribute("data-answer"));question()}});
 document.getElementById("back").onclick=home;
 var n=document.getElementById("next");if(n)n.onclick=function(){if(index+1<list.length){index++;question()}else finish()};
}
function finish(){
 var score=qs().filter(function(q,i){return answers[i]===q.answerIndex}).length;
 saved[active.id]={score:score,finishedAt:new Date().toISOString()};store();
 app.innerHTML=top()+'<h2 class="heading">号外！ 探偵任務完了</h2><p>正解数：<strong>'+score+' / '+qs().length+'</strong> 問</p><p>最後まで挑戦したので、ひみつの知識を解放！</p><div class="reward"><span class="stamp">'+(active.reward.type==="manga"?"漫画 × 現実":"昭和・歴史")+'</span><h2>'+esc(active.reward.title)+'</h2><p>'+esc(active.reward.text)+'</p></div><button class="btn" id="again">もう一度挑戦</button><button class="btn secondary" id="home">新聞棚へ</button>';
 document.getElementById("again").onclick=function(){start(active)};document.getElementById("home").onclick=home;
}
async function loadFile(e){
 var f=e.target.files[0];if(!f)return;
 try{var d=JSON.parse(await f.text()),extra=validate(d);var old=new Set(packs.map(function(p){return p.id}));extra.forEach(function(p){if(old.has(p.id))throw Error("ニュースIDが重複しています: "+p.id)});packs=packs.concat(extra);home();document.getElementById("notice").textContent=extra.length+"件の新聞を追加しました。"}
 catch(err){document.getElementById("notice").textContent="読み込み失敗: "+err.message}
}
async function boot(){
 try{
  var r=await fetch("./news.json?v=20261025-2",{cache:"no-store"});
  if(!r.ok)throw Error("HTTP "+r.status);
  var d=await r.json();packs=validate(d);home();
 }catch(err){app.innerHTML=top()+'<h2 class="heading">新聞を準備できませんでした</h2><p>読み込みエラー: '+esc(err.message)+'</p><p class="hint">news.json とゲーム本体の設定を確認してください。</p><button class="btn" id="retry">再読み込み</button>';document.getElementById("retry").onclick=boot}
}
boot();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}).catch(function(){})}
})();
</script></body></html>
