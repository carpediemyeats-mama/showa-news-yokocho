<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>昭和ニュース横丁</title><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#a63d2d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="./icon-192.png"><style>
:root{--paper:#f5e5bf;--ink:#392c22;--red:#a63d2d;--blue:#284c59}*{box-sizing:border-box}body{margin:0;background:#292d31;color:var(--ink);font-family:"Yu Mincho","Hiragino Mincho ProN",serif}.street{min-height:100vh;background:linear-gradient(#172d42 0%,#59636b 36%,#a87b54 36%,#a87b54 39%,#52473b 39%,#52473b 100%);padding:22px 12px 45px}.shell{max-width:790px;margin:auto}.sky{text-align:center;color:#f7d9a0;text-shadow:2px 3px #1b1b1b}.sky small{letter-spacing:.35em}.sky h1{font-size:clamp(32px,7vw,58px);margin:8px 0 0;letter-spacing:.12em}.sky p{margin:5px 0 22px}.sign{background:#b34831;border:6px solid #e8c67f;box-shadow:0 7px #542e24;color:#fff2cc;text-align:center;padding:14px;letter-spacing:.15em;font-size:24px}.shop{border:9px solid #5b3427;background:repeating-linear-gradient(90deg,#e7d3a6 0 60px,#ddc99d 60px 64px);padding:18px;box-shadow:8px 12px #1e2529}.paper{background:var(--paper);border:2px solid #967c55;padding:22px;box-shadow:3px 5px #8e7356;min-height:330px}.meta{font-size:12px;color:#705e49;letter-spacing:.12em}.heading{border-bottom:3px double #594a39;padding-bottom:9px;font-size:26px;margin:8px 0 15px}.btn{background:var(--blue);color:#fff5d9;border:2px solid #182d34;padding:12px 15px;font:700 16px sans-serif;cursor:pointer;box-shadow:3px 3px #a28d6a;border-radius:3px}.btn:hover{filter:brightness(1.15)}.btn:disabled{opacity:.5}.secondary{background:#a64a32;border-color:#723320}.choice{display:block;width:100%;text-align:left;margin:10px 0;background:#fff8e8;color:#34281d;border:2px solid #98815c;padding:13px;font:16px sans-serif;cursor:pointer}.choice.selected{border:3px solid var(--red)}.choice.good{background:#d8ebd6}.choice.bad{background:#f0d0c6}.reward summary{cursor:pointer;font-weight:bold}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.tile{border:3px solid #80603f;background:#fff5dc;padding:14px;text-align:left;cursor:pointer;color:inherit}.tile h3{margin:6px 0}.tile p{font-size:14px;line-height:1.7}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}.stamp{display:inline-block;border:3px double var(--red);color:var(--red);padding:6px;transform:rotate(-5deg);font-weight:bold}.reward{background:#f9f0d5;border:3px double #ad8648;padding:18px;line-height:1.9}.hint{font-size:13px;line-height:1.6;color:#68553c}.progress{height:10px;background:#d2bd95;margin:14px 0}.progress>div{height:100%;background:#a44a32;transition:width .2s}.foot{margin-top:18px;color:#f3d6a3;font-size:12px;text-align:center}input[type=file]{max-width:100%}.hidden{display:none}@media(max-width:500px){.paper{padding:15px}.shop{padding:10px}.heading{font-size:22px}}
</style></head><body><div class="street"><div class="shell"><header class="sky"><small>昭和レトロ学習探検</small><h1>昭和ニュース横丁</h1><p>新聞をめくれば、世界が広がる。</p></header><div class="sign">夕刊ニュース屋　◉　知識探偵団</div><main class="shop"><div class="paper" id="app"></div></main><div class="foot">外部広告・音声なし／記録は端末ごとに保存／ニュースは管理者が更新</div></div></div><script>
const SEED={schemaVersion:"1.0",news:[]};
const KEY="showa-quest-v1";let packs=[...SEED.news],active=null,index=0,answers=[],mode="home";let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const app=document.getElementById("app");const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function store(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}
function top(){return `<div class="row"><span class="meta">昭和ニュース横丁　/　長男編</span><span class="stamp">知識探偵</span></div>`}
function home(){mode="home";app.innerHTML=top()+`<h2 class="heading">本日の新聞棚</h2><p>新聞記事を選んで、４つの謎を解こう。読了すると「ひみつの豆知識」が開くぞ。</p><div class="tiles">${packs.map((p,i)=>`<button class="tile" data-i="${i}"><span class="meta">${esc(p.category)} ${p.isDemo?"／体験版":""}</span><h3>${esc(p.title)}</h3><p>${esc(p.summary)}</p><span class="stamp">${saved[p.id]?"読了":"未読"}</span></button>`).join("")}</div><hr><h3>古本屋・発見図鑑</h3><div id="library"></div><hr><h3>今週の新聞を更新するには</h3><p class="hint">公開サイトの news.json を差し替えると、次回起動時に新しい新聞が届きます。ここから一時的にJSONを追加することもできます（この方法で追加した分は再起動後に残りません）。</p><input type="file" id="file" accept=".json,application/json"><p id="notice" class="hint"></p>`;document.getElementById("library").innerHTML=packs.filter(p=>saved[p.id]).map(p=>`<details class="reward"><summary>${esc(p.reward.title)}　📖</summary><p>${esc(p.reward.text)}</p></details>`).join("")||"<p class='hint'>新聞を1つ読み終えると、ここに歴史や漫画の考察が並ぶよ。</p>";app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>start(packs[+b.dataset.i]));document.getElementById("file").onchange=load}
function start(p){active=p;index=0;answers=[];mode="quiz";question()}
function questions(){return active.questions.filter(q=>q.audience==="common"||q.audience==="older")}
function question(){let q=questions()[index],ans=answers[index];app.innerHTML=top()+`<div class="meta">${esc(active.title)}　／　第${index+1}問・全${questions().length}問</div><div class="progress"><div style="width:${100*index/questions().length}%"></div></div><h2 class="heading">${esc(q.prompt)}</h2>${q.choices.map((c,i)=>`<button class="choice ${ans===undefined?"":i===q.answerIndex?"good":i===ans?"bad":""}" data-a="${i}" ${ans!==undefined?"disabled":""}>${"アイウエ"[i]}　${esc(c)}</button>`).join("")}${ans!==undefined?`<div class="reward"><strong>${ans===q.answerIndex?"正解！":"惜しい！ 正解は「"+esc(q.choices[q.answerIndex])+"」"}</strong><p>${esc(q.explanation)}</p></div><button class="btn" id="next">${index===questions().length-1?"新聞を読み終える":"次の問題へ"}</button>`:"<p class='hint'>選択肢を押すと、正解と解説が出るよ。</p>"}<p><button class="btn secondary" id="back">新聞棚へ戻る</button></p>`;app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{answers[index]=+b.dataset.a;question()});app.querySelector("#back").onclick=home;let n=app.querySelector("#next");if(n)n.onclick=()=>{if(index+1<questions().length){index++;question()}else finish()}}
function finish(){mode="done";let score=questions().filter((q,i)=>answers[i]===q.answerIndex).length;saved[active.id]={score,finishedAt:new Date().toISOString()};store();app.innerHTML=top()+`<h2 class="heading">号外！ 探偵任務完了</h2><p>正解数：<strong>${score} / ${questions().length}</strong> 問</p><p>最後まで挑戦したので、ひみつの知識を解放！</p><div class="reward"><div class="stamp">${active.reward.type==="manga"?"漫画 × 現実":"昭和・歴史"}</div><h2>${esc(active.reward.title)}</h2><p>${esc(active.reward.text)}</p></div><p><button class="btn" id="again">もう一度挑戦</button> <button class="btn secondary" id="home">新聞棚へ</button></p>`;app.querySelector("#again").onclick=()=>start(active);app.querySelector("#home").onclick=home}
function validate(x){if(!x||x.schemaVersion!=="1.0"||!Array.isArray(x.news))throw Error("schemaVersion 1.0 と news 配列が必要です");let ids=new Set(packs.flatMap(p=>[p.id,...p.questions.map(q=>q.id)]));for(let p of x.news){if(!p||typeof p.id!=="string"||!p.title||!p.summary||!p.reward||!p.reward.title||!p.reward.text||!["history","manga","trivia"].includes(p.reward.type)||!Array.isArray(p.questions)||p.questions.length!==4)throw Error("ニュースの項目か問題数が不正です");if(ids.has(p.id))throw Error("ニュースIDが重複: "+p.id);ids.add(p.id);let count={common:0,older:0};for(let q of p.questions){if(!q.id||ids.has(q.id)||!["common","older"].includes(q.audience)||typeof q.prompt!=="string"||!Array.isArray(q.choices)||q.choices.length!==4||q.choices.some(c=>typeof c!=="string"||!c.trim())||new Set(q.choices).size!==4||!Number.isInteger(q.answerIndex)||q.answerIndex<0||q.answerIndex>3||!q.explanation)throw Error("問題データが不正: "+(q.id||"IDなし"));ids.add(q.id);count[q.audience]++}if(count.common!==2||count.older!==2)throw Error("共通2問・長男2問が必要です");if(!Array.isArray(p.sources)||!p.sources.length)throw Error("出典情報が必要です")}return x.news}
async function load(e){let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());let news=validate(x);packs.push(...news);home();document.getElementById("notice").textContent=`${news.length}件の新聞を追加しました。`}catch(err){document.getElementById("notice").textContent="読み込み失敗："+err.message}}
async function boot(){try{const r=await fetch('./news.json',{cache:'no-cache'});if(!r.ok)throw Error('fetch');const d=await r.json();packs=validate(d);home()}catch(e){app.innerHTML=top()+`<h2 class="heading">新聞を準備しています</h2><p>ニュースの読み込みに失敗しました。通信環境を確認して再読み込みしてください。</p><button class="btn" onclick="location.reload()">再読み込み</button>`}}
boot();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
